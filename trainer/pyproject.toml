[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exterm-trainer"
version = "0.1.0"
description = "Reinforcement learning training engine and protocol server for exterm"
authors = [
    { name = "exterm team" }
]
requires-python = ">=3.10,<3.13"
dependencies = [
    "cryptography>=42.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "websockets>=12.0",
    "pydantic>=2.5.0",
    "gymnasium[classic-control,other]>=0.29.0",
    "stable-baselines3>=2.3.0",
    "torch>=2.2.0",
    "httpx>=0.27.0",
    "langgraph>=1.2.11",
    "langchain>=1.3.18",
    "langchain-core>=1.6.1",
    "langchain-ollama>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[project.scripts]
exterm-trainer = "exterm_trainer.__main__:main"
